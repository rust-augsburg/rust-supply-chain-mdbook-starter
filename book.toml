[book]
title = "Supply Chain Security in Rust"
authors = ["Your Name"]
description = "Evaluating Rust crates for production use"
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
#additional-css = ["theme/presentation.css"]
git-repository-url = ""
edit-url-template = ""
additional-css = ["./mdbook-admonish.css"]

[output.html.search]
enable = true
limit-results = 20

[preprocessor]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`
